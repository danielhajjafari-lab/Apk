
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Prepare Android project structure
        run: |
          mkdir -p app/src/main/java/com/example/dakhlokharj app/src/main/res/values
          mv "build.gradle (1).kts" app/build.gradle.kts
          mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          mv MainActivity.kt app/src/main/java/com/example/dakhlokharj/MainActivity.kt
          mv Database.kt app/src/main/java/com/example/dakhlokharj/Database.kt
          mv SmsReceiver.kt app/src/main/java/com/example/dakhlokharj/SmsReceiver.kt
          mv styles.xml app/src/main/res/values/styles.xml
                - name: Fix JVM target compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          s = s.replace("VERSION_1_8", "VERSION_17")
          s = s.replace('jvmTarget = "1.8"', 'jvmTarget = "17"')
          s = s.replace('jvmTarget = "8"', 'jvmTarget = "17"')
          p.write_text(s)
          PY

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dakhlokharj-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
