name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.9/bin" >> "$GITHUB_PATH"
      -       - name: Prepare Android project structure
        run: |
          mkdir -p app/src/main/java/com/example/dakhlokharj app/src/main/res/values
          mv "build.gradle (1).kts" app/build.gradle.kts
          mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          mv MainActivity.kt app/src/main/java/com/example/dakhlokharj/MainActivity.kt
          mv Database.kt app/src/main/java/com/example/dakhlokharj/Database.kt
          mv SmsReceiver.kt app/src/main/java/com/example/dakhlokharj/SmsReceiver.kt
          mv styles.xml app/src/main/res/values/styles.xml
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/example/dakhlokharj/MainActivity.kt")
          s = p.read_text(encoding="utf-8")
          old = 'LaunchedEffect((ctx as Activity).intent?.getLongExtra("pending_amount",0L)){ val a=ctx.intent?.getLongExtra("pending_amount",0L)?:0L;'
          new = 'val activity = ctx as Activity\n LaunchedEffect(activity.intent.getLongExtra("pending_amount",0L)){ val a=activity.intent.getLongExtra("pending_amount",0L);'
          if old not in s:
              raise SystemExit("Expected code not found")
          s = s.replace(old, new, 1)
          s = s.replace("ctx.intent", "activity.intent")
          s = s.replace("@Composable fun LedgerUI", "@OptIn(ExperimentalMaterial3Api::class)\n@Composable fun LedgerUI", 1)
          p.write_text(s, encoding="utf-8")
          PY
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dakhlokharj-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
